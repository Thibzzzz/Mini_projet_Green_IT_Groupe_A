{% extends "base.html" %}
{% block title %}Inscription — GreenBet{% endblock %}
{% block content %}
<div class="container section" style="max-width:460px">
  <h1 class="mb-2">Créer un compte</h1>
  {% if errors %}
  <div class="alert alert-error mb-2">
    {% for e in errors %}<div>• {{ e }}</div>{% endfor %}
  </div>
  {% endif %}
  <div class="card">
    <form method="POST" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
        <label class="form-label" for="pseudo">Pseudo</label>
        <input class="form-input" type="text" id="pseudo" name="pseudo" value="{{ pseudo }}" required minlength="3" maxlength="50">
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Adresse email</label>
        <input class="form-input" type="email" id="email" name="email" value="{{ email }}" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Mot de passe <span class="text-muted">(8 car. min.)</span></label>
        <input class="form-input" type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm">Confirmer le mot de passe</label>
        <input class="form-input" type="password" id="confirm" name="confirm" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full mt-2">Créer mon compte</button>
    </form>
  </div>
  <p class="text-center mt-2 text-muted" style="font-size:.9rem">
    Déjà un compte ? <a href="{{ url_for('auth.login') }}">Connexion</a>
  </p>
</div>
{% endblock %}
